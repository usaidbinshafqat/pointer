name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag and app version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(python3 - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("app/build.gradle.kts").read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("versionName not found")
          print(match.group(1))
          PY
          )"
          test "$TAG_VERSION" = "$APP_VERSION"

      - name: Decode release keystore
        env:
          POINTER_KEYSTORE_BASE64: ${{ secrets.POINTER_KEYSTORE_BASE64 }}
        run: |
          test -n "$POINTER_KEYSTORE_BASE64"
          printf '%s' "$POINTER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pointer-release.jks"
          echo "POINTER_KEYSTORE_FILE=$RUNNER_TEMP/pointer-release.jks" >> "$GITHUB_ENV"

      - name: Test and assemble signed APK
        env:
          POINTER_KEYSTORE_PASSWORD: ${{ secrets.POINTER_KEYSTORE_PASSWORD }}
          POINTER_KEY_ALIAS: ${{ secrets.POINTER_KEY_ALIAS }}
          POINTER_KEY_PASSWORD: ${{ secrets.POINTER_KEY_PASSWORD }}
        run: |
          test -n "$POINTER_KEYSTORE_PASSWORD"
          test -n "$POINTER_KEY_ALIAS"
          test -n "$POINTER_KEY_PASSWORD"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace --no-daemon

      - name: Verify and name artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(python3 - <<'PY'
          import glob
          import os

          candidates = glob.glob(os.path.join(os.environ["ANDROID_HOME"], "build-tools", "*", "apksigner"))
          if not candidates:
              raise SystemExit("apksigner not found")
          print(sorted(candidates)[-1])
          PY
          )"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/pointer-$VERSION.apk"
          (cd dist && sha256sum "pointer-$VERSION.apk" > "pointer-$VERSION.apk.sha256")

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" > "$RUNNER_TEMP/release-notes.md" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?\n(.*?)(?=^## \[|\Z)",
              text,
              flags=re.MULTILINE | re.DOTALL,
          )
          if not match:
              raise SystemExit(f"CHANGELOG entry for {version} not found")
          print(match.group(1).strip())
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "pointer $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "dist/pointer-$VERSION.apk" \
            "dist/pointer-$VERSION.apk.sha256"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pointer-release.jks"
