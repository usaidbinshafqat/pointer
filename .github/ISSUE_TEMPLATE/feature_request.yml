name: Feature request
description: Suggest an improvement to Pointer
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: api
    attributes:
      label: Does this require a new Cursor API endpoint?
      options:
        - "No"
        - "Yes, documented"
        - "Yes, undocumented or unknown"
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy, security, or background-network impact
